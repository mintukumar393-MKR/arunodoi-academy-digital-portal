<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System Explorer</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(10, 15, 30, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --neon-cyan: #38bdf8;
      --neon-blue: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text-main);
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* HUD Overlay */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Glass Effect Panel */
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffedd5, #ea580c);
      box-shadow: 0 0 20px rgba(234, 88, 12, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 30%, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.65rem;
      color: var(--neon-cyan);
      letter-spacing: 3px;
      font-family: 'JetBrains Mono', monospace;
    }

    .top-actions {
      display: flex;
      gap: 12px;
    }

    .btn-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-pill:hover, .btn-pill.active {
      background: var(--neon-cyan);
      color: #030712;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    /* Left Sidebar: Planetary Navigation List */
    .nav-container {
      position: absolute;
      top: 90px;
      left: 24px;
      bottom: 90px;
      width: 220px;
      overflow-y: auto;
      padding: 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    .nav-container::-webkit-scrollbar {
      width: 4px;
    }
    .nav-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .nav-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-left: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    .planet-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 6px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.85rem;
    }

    .planet-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .planet-btn.active {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.4);
      color: #fff;
    }

    .planet-btn .orb-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 12px;
      box-shadow: 0 0 8px currentColor;
      flex-shrink: 0;
    }

    /* Right Details Inspector Card */
    .inspector-card {
      position: absolute;
      top: 90px;
      right: 24px;
      width: 320px;
      padding: 24px;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }

    .inspector-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }

    .inspector-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .inspector-type {
      font-size: 0.7rem;
      color: var(--neon-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'JetBrains Mono', monospace;
    }

    .inspector-desc {
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }

    /* Bottom Control Bar */
    footer {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 24px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .speed-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 4px 10px;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .speed-btn.active {
      background: var(--neon-cyan);
      color: #030712;
      font-weight: 700;
    }

    /* Code Modal (As featured in the reel) */
    .code-window {
      position: absolute;
      bottom: 24px;
      left: 260px;
      width: 380px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
      transition: all 0.3s ease;
      z-index: 20;
    }

    .code-window.minimized {
      transform: translateY(calc(100% + 40px));
      opacity: 0;
      pointer-events: none;
    }

    .code-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .traffic-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }

    .code-filename {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .code-content {
      padding: 14px;
      font-size: 0.75rem;
      line-height: 1.5;
      color: #94a3b8;
      max-height: 200px;
      overflow-y: auto;
    }

    .kw { color: #f43f5e; }
    .prop { color: #38bdf8; }
    .val { color: #fbbf24; }
    .sel { color: #a855f7; }

    @media (max-width: 900px) {
      .code-window { display: none; }
      .inspector-card { width: 280px; }
      .nav-container { width: 170px; }
    }
  </style>
</head>
<body>

  <!-- WebGL Three.js Container -->
  <canvas id="webgl-canvas"></canvas>

  <!-- HUD Interface -->
  <div class="hud-overlay">
    <!-- Top Bar -->
    <header>
      <div class="brand interactive">
        <div class="brand-icon">
          <i class="fa-solid fa-sun" style="color: #fff;"></i>

</button>

        </div>
        <div class="stat-item">
          <div class="stat-label">Moons</div>
          <div class="stat-value" id="inst-moons">0</div>
        </div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <footer>
      <div class="bottom-bar glass-panel interactive">
        <div class="control-group">
          <label>SPEED:</label>
          <button class="speed-btn" data-speed="0">PAUSE</button>
          <button class="speed-btn active" data-speed="1">1x</button>
          <button class="speed-btn" data-speed="5">5x</button>
          <button class="speed-btn" data-speed="20">20x</button>
        </div>
      </div>
    </footer>
  </div>

    // 2. Procedural Texture Generators
   function createProceduralTexture(type, baseColor) {
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 512;

  const ctx = canvas.getContext('2d');

  // =========================
  // SUN
  // =========================
  if (type === 'sun') {

    const grad = ctx.createRadialGradient(
      500, 250, 30,
      500, 250, 600
    );

    grad.addColorStop(0, '#fff7b2');
    grad.addColorStop(0.25, '#ffd54a');
    grad.addColorStop(0.65, '#ff9800');
    grad.addColorStop(1, '#e65100');

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1024, 512);

    // Solar surface
    for (let i = 0; i < 5000; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 512;
      const size = Math.random() * 3 + 1;

      ctx.fillStyle =
        Math.random() > 0.5
          ? 'rgba(255,255,180,0.16)'
          : 'rgba(180,50,0,0.12)';

      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }

  // =========================
  // MERCURY
  // =========================
  } else if (type === 'mercury') {

    ctx.fillStyle = '#777b82';
    ctx.fillRect(0, 0, 1024, 512);

    // Rocky surface
    for (let i = 0; i < 2500; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 512;
      const shade = 70 + Math.random() * 80;

      ctx.fillStyle =
        `rgb(${shade}, ${shade}, ${shade + 5})`;

      ctx.fillRect(x, y, 2, 2);
    }

    // Craters
    for (let i = 0; i < 100; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 512;
      const r = Math.random() * 12 + 3;

      ctx.strokeStyle = 'rgba(30,30,30,0.45)';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.beginPath();
      ctx.arc(x - r * 0.2, y - r * 0.2, r * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }

  // =========================
  // VENUS
  // =========================
  } else if (type === 'venus') {

    const grad = ctx.createLinearGradient(0, 0, 0, 512);

    grad.addColorStop(0, '#d6a85c');
    grad.addColorStop(0.3, '#f0c875');
    grad.addColorStop(0.6, '#d8a957');
    grad.addColorStop(1, '#9c6b32');

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1024, 512);

    // Thick cloud bands
    for (let y = 0; y < 512; y += 12) {
      ctx.fillStyle =
        `rgba(255,245,190,${0.12 + Math.random() * 0.12})`;

      ctx.fillRect(0, y, 1024, 6);
    }

  // =========================
  // EARTH
  // =========================
  } else if (type === 'earth') {

    // Ocean
    const ocean = ctx.createLinearGradient(0, 0, 0, 512);

    ocean.addColorStop(0, '#174ea6');
    ocean.addColorStop(0.5, '#1976d2');
    ocean.addColorStop(1, '#082f73');

    ctx.fillStyle = ocean;
    ctx.fillRect(0, 0, 1024, 512);

    // Land masses
    const landAreas = [
      [220, 150, 75, 45],
      [320, 125, 55, 35],
      [410, 180, 80, 55],
      [500, 135, 65, 40],
      [620, 170, 90, 50],
      [750, 125, 55, 35],
      [790, 260, 80, 50],
      [650, 330, 100, 55],
      [470, 340, 75, 45],
      [300, 300, 65, 40],
      [170, 350, 55, 35]
    ];

    landAreas.forEach(([x, y, rx, ry]) => {
      ctx.fillStyle = '#3f8f45';

      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#6e9f42';

      ctx.beginPath();
      ctx.ellipse(
        x + rx * 0.15,
        y - ry * 0.15,
        rx * 0.55,
        ry * 0.45,
        0,
        0,
        Math.PI * 2
      );
      ctx.fill();
    });

    // Deserts
    for (let i = 0; i < 18; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 512;

      ctx.fillStyle = 'rgba(210,180,90,0.35)';
      ctx.beginPath();
      ctx.arc(x, y, 10 + Math.random() * 18, 0, Math.PI * 2);
      ctx.fill();
    }

    // Polar ice
    ctx.fillStyle = 'rgba(245,250,255,0.85)';

    ctx.beginPath();
    ctx.ellipse(500, 8, 250, 25, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(500, 504, 250, 25, 0, 0, Math.PI * 2);
    ctx.fill();

    // Clouds
    for (let i = 0; i < 80; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 512;

      ctx.fillStyle = 'rgba(255,255,255,0.25)';

      ctx.beginPath();
      ctx.ellipse(
        x,
        y,
        20 + Math.random() * 35,
        4 + Math.random() * 6,
        0,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

  // =========================
  // MARS
  // =========================
  } else if (type === 'mars') {

    const grad = ctx.createLinearGradient(0, 0, 0, 512);

    grad.addColorStop(0, '#b94b32');
    grad.addColorStop(0.5, '#8f3426');
    grad.addColorStop(1, '#5c2119');

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1024, 512);

    // Dark surface regions
    for (let i = 0; i < 80; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 512;
      const r = 5 + Math.random() * 25;

      ctx.fillStyle = 'rgba(50,15,10,0.18)';

      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Polar ice
    ctx.fillStyle = 'rgba(235,235,225,0.75)';

    ctx.beginPath();
    ctx.ellipse(500, 10, 180, 20, 0, 0, Math.PI * 2);
    ctx.fill();

  // =========================
  // JUPITER
  // =========================
  } else if (type === 'jupiter') {

    const bands = [
      '#c99562',
      '#e4c08c',
      '#a96f43',
      '#ead0a0',
      '#b77b4b',
      '#d9aa72',
      '#9c633f'
    ];

    const bandHeight = 512 / bands.length;

    bands.forEach((color, i) => {
      ctx.fillStyle = color;
      ctx.fillRect(0, i * bandHeight, 1024, bandHeight + 3);
    });

    // Atmospheric turbulence
    for (let i = 0; i < 400; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 512;

      ctx.fillStyle =
        Math.random() > 0.5
          ? 'rgba(255,255,255,0.08)'
          : 'rgba(80,40,20,0.10)';

      ctx.fillRect(
        x,
        y,
        20 + Math.random() * 50,
        3 + Math.random() * 8
      );
    }

    // Great Red Spot
    ctx.fillStyle = '#a8432c';

    ctx.beginPath();
    ctx.ellipse(
      700,
      330,
      75,
      38,
      -0.08,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,220,190,0.25)';
    ctx.lineWidth = 8;

    ctx.beginPath();
    ctx.ellipse(
      700,
      330,
      90,
      45,
      -0.08,
      0,
      Math.PI * 2
    );
    ctx.stroke();

  // =========================
  // SATURN
  // =========================
  } else if (type === 'saturn') {

    const grad = ctx.createLinearGradient(0, 0, 0, 512);

    grad.addColorStop(0, '#d6bf91');
    grad.addColorStop(0.25, '#ead7a8');
    grad.addColorStop(0.5, '#bda276');
    grad.addColorStop(0.75, '#e0c894');
    grad.addColorStop(1, '#a88b62');

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1024, 512);

    // Subtle atmospheric bands
    for (let y = 30; y < 500; y += 28) {
      ctx.fillStyle = 'rgba(90,70,45,0.08)';
      ctx.fillRect(0, y, 1024, 9);
    }

  // =========================
  // URANUS
  // =========================
  } else if (type === 'uranus') {

    const grad = ctx.createLinearGradient(0, 0, 0, 512);

    grad.addColorStop(0, '#b9f4ed');
    grad.addColorStop(0.5, '#63d9d0');
    grad.addColorStop(1, '#42aaa7');

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1024, 512);

    // Very subtle bands
    for (let y = 50; y < 500; y += 45) {
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(0, y, 1024, 8);
    }

  // =========================
  // NEPTUNE
  // =========================
  } else if (type === 'neptune') {

    const grad = ctx.createLinearGradient(0, 0, 0, 512);

    grad.addColorStop(0, '#385bd6');
    grad.addColorStop(0.45, '#2447b8');
    grad.addColorStop(1, '#142c80');

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1024, 512);

    // Atmospheric bands
    for (let y = 30; y < 500; y += 35) {
      ctx.fillStyle = 'rgba(160,190,255,0.08)';
      ctx.fillRect(0, y, 1024, 8);
    }

    // Dark storm
    ctx.fillStyle = 'rgba(10,25,80,0.45)';

    ctx.beginPath();
    ctx.ellipse(
      680,
      260,
      70,
      28,
      0,
      0,
      Math.PI * 2
    );
    ctx.fill();

  // =========================
  // FALLBACK
  // =========================
  } else {

    ctx.fillStyle = baseColor;
    ctx.fillRect(0, 0, 1024, 512);

    for (let i = 0; i < 3000; i++) {
      ctx.fillStyle =
        Math.random() > 0.5
          ? 'rgba(255,255,255,0.05)'
          : 'rgba(0,0,0,0.10)';

      ctx.fillRect(
        Math.random() * 1024,
        Math.random() * 512,
        2,
        2
      );
    }
  }

  const texture = new THREE.CanvasTexture(canvas);

  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.ClampToEdgeWrapping;

  texture.needsUpdate = true;

  return texture;
}

// Background Space Music
let audioContext;
let musicTimer;
let musicPlaying = false;

const musicBtn = document.getElementById('toggle-music-btn');

const notes = [
  261.63, 329.63, 392.00,
  329.63, 293.66, 349.23,
  440.00, 392.00
];

function playSpaceNote(frequency, duration = 1.8) {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = 'sine';
  oscillator.frequency.value = frequency;

  gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.045,
    audioContext.currentTime + 0.15
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audioContext.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();
  oscillator.stop(audioContext.currentTime + duration);
}

function startSpaceMusic() {
  if (musicPlaying) return;

  musicPlaying = true;

  let index = 0;

  function playNext() {
    if (!musicPlaying) return;

    playSpaceNote(notes[index], 2.2);

    index = (index + 1) % notes.length;

    musicTimer = setTimeout(playNext, 1900);
  }

  playNext();
}

function stopSpaceMusic() {
  musicPlaying = false;

  if (musicTimer) {
    clearTimeout(musicTimer);
  }
}

musicBtn.addEventListener('click', async () => {

  if (!audioContext) {
    audioContext = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();
  }

  if (audioContext.state === 'suspended') {
    await audioContext.resume();
  }

  if (!musicPlaying) {

    startSpaceMusic();

    musicBtn.innerHTML =
      '<i class="fa-solid fa-volume-high"></i> Music On';

    musicBtn.classList.add('active');

  } else {

    stopSpaceMusic();

    musicBtn.innerHTML =
      '<i class="fa-solid fa-music"></i> Music Off';

    musicBtn.classList.remove('active');
  }
});

    // 5. Animation Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // Update Planet Positions & Rotations
      celestialObjects.forEach(obj => {
        obj.mesh.rotation.y += obj.data.rotSpeed * (timeScale === 0 ? 0.2 : timeScale);

        if (obj.data.dist > 0) {
          obj.angle += obj.data.speed * 0.5 * timeScale * delta;
          obj.group.position.x = Math.cos(obj.angle) * obj.data.dist;
          obj.group.position.z = Math.sin(obj.angle) * obj.data.dist;
        }
      });

      // Smooth camera follow when planet is selected
      if (selectedObject) {
        const targetPos = new THREE.Vector3();
        selectedObject.group.getWorldPosition(targetPos);
        controls.target.lerp(targetPos, 0.05);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // 6. Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
